{% extends "base.html" %}

{% block title %}
    Edit profile
{% endblock %}

{% block content %}
    <span class="label">Your profile</span>
    <h2 class="page-title">Edit profile</h2>
    <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <div class="profile-actions">
            <input class="btn-primary" type="submit" value="Save">
        </div>
    </form>
{% endblock %}
