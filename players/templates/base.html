<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gambit Chess Club{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Gambit Chess Club</h1>
        <nav>
            {% if user.is_authenticated %}
                Hi, {{ user.username }}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <input type="submit" value="Log out">
                </form>
            {% else %} 
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
